run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - bodyclose
    - noctx
    # Test discipline. thelper flags helper funcs (that call t.Error/t.Fatal)
    # without t.Helper() — failures otherwise point at the helper line, not
    # the actual call site. tparallel flags subtests that miss t.Parallel()
    # under a parallel parent.
    - thelper
    - tparallel
    # Anti-complexity ratchet: thresholds set just above today's worst
    # offenders so the current codebase passes while new growth is flagged.
    - funlen
    - gocyclo
  disable:
    # TODO(arch-remediation): re-enable after cleanup — 24 gosimple findings (struct literal conversions)
    - gosimple
    # TODO(arch-remediation): re-enable after cleanup — 21 unused findings (false-positives under chromium build tag)
    - unused
    # TODO(arch-remediation): re-enable after cleanup — 9 copyloopvar findings (advisory "copy can be deleted")
    - copyloopvar

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment  # too noisy for a migration project
      - shadow          # common pattern in error handling
      # TODO(arch-remediation): re-enable after cleanup — 12 unusedwrite findings (test struct literals)
      - unusedwrite

  funlen:
    # Ratchet thresholds set just above today's worst offenders so the
    # current codebase passes while any NEW function larger than these
    # fails CI. Current worst: Search 566 lines / 315 statements.
    # Headroom ~2-3%.
    lines: 580
    statements: 320

  gocyclo:
    # Ratchet threshold just above today's worst offender (Search = 105).
    # Headroom ~5%. Any NEW function with complexity > 110 fails CI.
    min-complexity: 110

  errcheck:
    exclude-functions:
      # Fire-and-forget writes to HTTP response writers.
      - (net/http.ResponseWriter).Write
      # Deferred rollbacks — error is expected when commit already ran.
      - (*github.com/jackc/pgx/v5.Tx).Rollback
      # Crypto rand — panics on failure anyway.
      - crypto/rand.Read
      # SSE relay: io.WriteString to an already-streaming ResponseWriter; write error = connection dropped, already terminal.
      - io.WriteString
      # ODS parser: fmt.Sscanf on a best-effort numeric field; parse failure leaves n at its zero value which is correct.
      - fmt.Sscanf

issues:
  exclude-rules:
    # Test files can be more relaxed.
    - path: _test\.go
      linters:
        - errcheck
        - noctx
        - funlen
        - tparallel
    # Fire-and-forget scheduler enqueue calls inside ticker goroutines; errors are logged by the callee.
    # TODO(arch-remediation): propagate enqueue errors to a metrics counter.
    - path: internal/rss/scheduler\.go
      linters:
        - errcheck
      text: "enqueuePoll"
    - path: internal/confluence/scheduler\.go
      linters:
        - errcheck
      text: "enqueueSync"
    # AWS SDK v2 deprecated endpoint resolver — pre-existing, requires upstream SDK upgrade.
    # TODO(arch-remediation): upgrade aws-sdk-go-v2 endpoint resolution to service-specific resolver.
    - path: internal/storage/storage\.go
      linters:
        - staticcheck
      text: "SA1019"
    # Empty branch in metrics test: pre-existing; the if block intentionally left empty as a no-op guard.
    # TODO(arch-remediation): either add an assertion or remove the dead branch.
    - path: internal/observability/metrics_test\.go
      linters:
        - staticcheck
      text: "SA9003"
    # SSE streaming goroutine: resp.Body is closed via defer inside the spawned goroutine;
    # bodyclose cannot follow goroutine boundaries — this is a known false positive.
    # TODO(arch-remediation): refactor DoStream to make close ownership explicit.
    - path: internal/ai/client\.go
      linters:
        - bodyclose
    # Analytics paramOffset increment at end of builder branches: the increment is dead
    # but the pattern is consistent across all three query builders; harmless.
    # TODO(arch-remediation): remove trailing paramOffset++ in analytics store builders.
    - path: internal/analytics/store_pg\.go
      linters:
        - ineffassign
