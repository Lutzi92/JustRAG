name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # All third-party actions are pinned by commit SHA (tag in trailing
      # comment) — mutable tags can be moved or deleted upstream, which is
      # exactly how trivy-action v0.28.0 broke this workflow.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # needed for git rev-parse in Dockerfile

      # `git describe` gives a human-legible build id: exactly `v0.1.0` on a
      # release tag, `v0.1.0-12-gabc1234` on main. Still unique per commit, so
      # the frontend's useVersionCheck (which only compares for inequality)
      # keeps working unchanged. `--always` covers the pre-first-tag case.
      # No `--dirty`: CI trees are always clean and it would only mislead.
      - name: Compute build version
        id: ver
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is deliberately absent: a floating tag pinned by every
          # deployment is exactly how production drifts forward on an
          # unrelated pod restart. `edge` replaces it for tip-of-main.
          # The `v` prefix keeps image tag == git tag and lets the prune
          # step below exclude releases with an unambiguous `v*`.
          tags: |
            type=sha,prefix=,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Buildx is required for the SBOM/provenance attestations below — the
      # default docker driver silently ignores them.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the build id into the server binary via -ldflags (see the
          # BUILD_VERSION ARG in the Dockerfile), which is what GET /version
          # reports. The frontend polls that endpoint to notice a deployment;
          # without this the ARG keeps its "unknown" default, /version returns
          # the same string for every release, and update detection can never
          # fire. On a release tag this is exactly the tag (`v0.1.0`).
          build-args: |
            BUILD_VERSION=${{ steps.ver.outputs.version }}
          # Attach SBOM + minimal provenance attestations to the pushed image
          # (inspectable via `docker buildx imagetools inspect <ref> --format
          # '{{ json .SBOM }}'`).
          sbom: true
          provenance: mode=min

      - name: Compute lowercase image ref for scanning
        id: scanref
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # Fails the workflow on fixable CRITICAL vulnerabilities in the pushed
      # image. The image is already in the registry at this point — the gate
      # is an alert, not a publish block; rollback is `keep-n-tagged` below.
      - name: Scan image for critical vulnerabilities
        # v0.28.0 broke when upstream deleted the setup-trivy tag it
        # referenced; ≥v0.29 pins setup-trivy by hash.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.scanref.outputs.ref }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # Trivy's default 5m timeout is flaky on cold-cache runs — a full
          # image scan with a fresh vuln-DB download has hit the deadline
          # mid-layer-analysis on slow runners.
          timeout: 15m
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase package name
        id: pkg
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: echo "name=${REPO_NAME,,}" >> "$GITHUB_OUTPUT" # GHCR package name is the lowercased image name

      - name: Prune old container image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ steps.pkg.outputs.name }}
          delete-untagged: true # remove dangling layers left after re-tagging
          # Without this, `keep-n-tagged` deletes release images after ten
          # further main pushes — destroying the exact rollback targets
          # versioning exists to create. `exclude-tags` supports wildcards and
          # is applied BEFORE keep-n-tagged, so releases are never considered.
          exclude-tags: stable,edge,v*
          keep-n-tagged: 10 # applies only to main's SHA-tagged images now
          token: ${{ secrets.GITHUB_TOKEN }}
