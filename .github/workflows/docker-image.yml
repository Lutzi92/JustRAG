name: Build and Push Docker Image

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for git rev-parse in Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Compute lowercase package name
        id: pkg
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: echo "name=${REPO_NAME,,}" >> "$GITHUB_OUTPUT" # GHCR package name is the lowercased image name

      - name: Prune old container image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ steps.pkg.outputs.name }}
          delete-untagged: true # remove dangling layers left after re-tagging
          keep-n-tagged: 10 # retain the 10 most recent SHA-tagged images for rollback
          token: ${{ secrets.GITHUB_TOKEN }}
