# Docling Serve — shared, layout-aware document parser + image captioner.
#
# Runs as its own Deployment (NOT bundled into the worker pods): it's a Python
# service carrying ~3GB of models, so co-locating it in every HPA'd worker pod
# would be wasteful. The Go workers reach it over the cluster Service below.
#
# Enable it from the JustRAG admin Agent panel:
#   docling_enabled  = true
#   docling_base_url = http://docling.justrag.svc.cluster.local:5001
#   (in-namespace, http://docling:5001 also resolves)
#
# Image captioning (do_picture_description): the vision endpoint, API key and
# model are injected per request by the Go backend — nothing model-related is
# configured here. What this pod MUST carry is
# DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true (env below); without it docling
# refuses to build the captioning pipeline and every conversion fails over to
# the built-in parsers. The Go worker probes for this at startup and logs an
# error. See docs/observability/docling.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling
  namespace: justrag
  labels:
    app: justrag
    component: docling
spec:
  # Fixed low replica count is INTENTIONAL and acts as the throttle: Docling's
  # captioning calls to gemma-4 bypass the app's AI_MAX_CONCURRENT_REQUESTS
  # ceiling, so a fleet of Docling pods could starve live chat on the shared
  # gemma-4. Cap replicas (and Docling's own per-pod concurrency) instead of
  # adding an HPA. Raise deliberately if you give ingestion its own gemma-4.
  replicas: 2
  selector:
    matchLabels:
      app: justrag
      component: docling
  strategy:
    # Models are large; avoid two full model loads racing during a rollout.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: justrag
        component: docling
    spec:
      # Captioning + layout models make pod start slow; give it room to drain.
      terminationGracePeriodSeconds: 120
      # Uncomment if your repo / registry is private:
      # imagePullSecrets:
      # - name: ghcr-secret
      containers:
        - name: docling
          # Pinned. `latest` is a moving target: the picture_description_api
          # field this integration sends is deprecated upstream (since 1.21) and
          # a silent removal lands as "every PDF falls back to pdftotext". Bump
          # deliberately and re-run the live integration tests
          # (docs/observability/docling.md). For a GPU pool use the explicit
          # version of docling-serve-cu128 / -cu130 — those have no :latest.
          #   https://github.com/docling-project/docling-serve/releases
          image: quay.io/docling-project/docling-serve:v1.32.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: DOCLING_SERVE_ENABLE_UI
              value: "false"
            # Required for image captioning: docling only talks to a remote
            # vision API when this is set explicitly. Harmless when captioning
            # is off.
            - name: DOCLING_SERVE_ENABLE_REMOTE_SERVICES
              value: "true"
            # Lets the Go backend send picture_description_custom_config (the
            # non-deprecated successor of picture_description_api) per request.
            - name: DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_DESCRIPTION_CONFIG
              value: "true"
            # The sync convert endpoint answers 504 after this many seconds
            # regardless of the client's timeout (default 120). Keep it >= the
            # worker's DOCLING_TIMEOUT_SECONDS (default 300).
            - name: DOCLING_SERVE_MAX_SYNC_WAIT
              value: "600"
            # Two conversion threads per pod (the default) × replicas is the
            # real concurrency; at captioning concurrency 1 per document that
            # bounds in-flight vision calls to 2 × replicas.
            - name: DOCLING_SERVE_ENG_LOC_NUM_WORKERS
              value: "2"
            # Image captioning config (endpoint + API key + model id) is injected
            # per-request by the Go backend from the admin AI provider config — it
            # is NOT set on this sidecar, so the model-API credential never lives
            # here. Docling must still be able to reach that model Service from
            # this pod (same cluster/namespace network).
          resources:
            # CPU-only sizing. Docling's own layout/OCR/table models run here;
            # the heavy vision work happens on gemma-4, not in this pod. Add
            #   nvidia.com/gpu: 1
            # under requests AND limits (plus a GPU node selector/toleration) if
            # you have a GPU pool and want faster layout parsing.
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 10Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            # First boot downloads ~3GB of weights; don't mark ready too early.
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /.cache
      volumes:
        # emptyDir re-downloads the ~3GB models on every pod restart, which
        # turns a rollout into a multi-minute cold start (readiness gates on
        # it). Prefer a PersistentVolumeClaim (ReadWriteOnce per pod, or
        # ReadWriteMany shared across replicas if your storage supports it):
        #   - name: model-cache
        #     persistentVolumeClaim:
        #       claimName: docling-model-cache
        - name: model-cache
          emptyDir:
            sizeLimit: 6Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: docling
  namespace: justrag
  labels:
    app: justrag
    component: docling
spec:
  selector:
    app: justrag
    component: docling
  ports:
    - name: http
      port: 5001
      targetPort: 5001
