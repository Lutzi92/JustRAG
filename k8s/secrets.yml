## Container registry pull secret (only needed for private repos)
## Create with:
##   kubectl -n justrag create secret docker-registry ghcr-secret \
##     --docker-server=ghcr.io \
##     --docker-username=<GITHUB_USERNAME> \
##     --docker-password=<GITHUB_PAT_WITH_READ_PACKAGES> \
##     --docker-email=<EMAIL>

---
## Worker configuration secrets
## Create with:
##   kubectl -n justrag create secret generic worker-secrets \
##     --from-literal=DB_PASSWORD='<your-db-password>' \
##     --from-literal=VECTOR_DB_PASSWORD='<your-vector-db-password>' \
##     --from-literal=REDIS_PASSWORD='<your-redis-password>' \
##     --from-literal=S3_ACCESS_KEY='<your-s3-access-key>' \
##     --from-literal=S3_SECRET_KEY='<your-s3-secret-key>' \
##     --from-literal=JWT_SECRET='<your-jwt-secret>'

## NOTE: Do not check in actual secrets. Use the kubectl commands above
## or a secrets manager (e.g., Sealed Secrets, External Secrets Operator).
