apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-batch
  namespace: justrag
  labels:
    app: justrag
    component: worker-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: justrag
      component: worker-batch
  template:
    metadata:
      labels:
        app: justrag
        component: worker-batch
    spec:
      terminationGracePeriodSeconds: 600
      # Uncomment if your repo is private:
      # imagePullSecrets:
      # - name: ghcr-secret
      containers:
      - name: worker
        # `:stable` moves only when a release candidate that passed staging is
        # promoted (.github/workflows/promote-release.yml), and the runbook runs
        # the migrations BEFORE promoting — so a pod that restarts on its own
        # can only land on a tested release whose schema is already in place.
        # `Always` is required: with IfNotPresent a node that has an older
        # `:stable` cached keeps running it, and pods end up on different
        # releases. Deploy = `kubectl rollout restart` after promoting.
        image: ghcr.io/ki4jlu/justrag:stable
        imagePullPolicy: Always
        command: ["/app/worker"]
        envFrom:
        - configMapRef:
            name: worker-config
        - secretRef:
            name: worker-secrets
        env:
        - name: WORKER_QUEUES
          value: "rag-batch"
        - name: WORKER_CONCURRENCY
          value: "2"
        # Maintenance runs only on batch worker (single replica) to avoid
        # duplicate stuck-file checks and orphaned vector cleanup.
        - name: WORKER_MAINTENANCE
          value: "true"
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
          # rag-batch currently has no enqueued job types in the codebase
          # (RSS poll → rag-quick, URL processing → rag-heavy, crawl →
          # rag-quick, academic → rag-quick). worker-batch only runs the
          # in-process maintenance loop. The chromium-tmp mount is kept
          # as harmless future-proofing in case a job type lands on
          # rag-batch later — Chromium can fall back to /tmp without
          # exploding the node disk.
          - name: chromium-tmp
            mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 3
          periodSeconds: 10
      volumes:
        - name: chromium-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
      restartPolicy: Always
