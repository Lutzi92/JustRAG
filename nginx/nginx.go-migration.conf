events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimization
    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    # Support large file uploads
    client_max_body_size 500M;

    # Docker internal DNS - re-resolves on each request for round-robin across replicas
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # Go server is the primary entry point during migration
        set $upstream http://go-server:3000;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check
        location /health {
            proxy_pass $upstream;
            access_log off;
        }

        # Suppress logs for high-frequency frontend polling (6 requests every ~300ms per open KB)
        location ~ ^/api/kb/[^/]+/(files|chats|rss|confluence-sources|generated-content)$ {
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            access_log off;
        }
        location = /api/confluence/connections {
            proxy_pass $upstream;
            proxy_http_version 1.1;
            access_log off;
        }

        # Main application
        location / {
            proxy_pass $upstream;

            # WebSocket support (if needed in future)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSE streaming support - disable buffering for real-time responses
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
    }
}
