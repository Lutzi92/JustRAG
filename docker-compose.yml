# Default docker-compose — Go backend.
#
# Usage:
#   docker compose up
#
# Architecture:
#   nginx (:3001 → :80) → go-server (:3000)
#   go-worker (Asynq) processes file uploads, RSS polls, etc.
#
# For local-from-source builds see docker-compose.local.yml; for the
# k8s-style app-only variant see docker-compose.k8s.yml.

services:
  nginx:
    # Stable branch. 1.29.x was mainline and stopped receiving fixes when the
    # 1.30 stable branch forked (Apr 2026); staying on it stranded 16 CVEs,
    # incl. two heap overflows in ngx_http_rewrite_module (CVE-2026-42945,
    # CVE-2026-9256) that this config's `set` + regex-capture location reaches.
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      go-server:
        condition: service_healthy

  # One-shot init service: applies goose migrations, creates vector tables,
  # and seeds the admin user. Exits 0 on success; go-server and go-worker
  # wait for it via service_completed_successfully.
  migrate:
    # Version pin. Unset -> `stable`, which always points at the most recent
    # release, so a bare `docker compose up -d` still works with no .env.
    # Production sets JUSTRAG_VERSION=v0.1.0 in .env. The same expression is
    # used in docker-compose.production.yml and docker-compose.k8s.yml so
    # overlay combinations cannot run server and workers on different
    # versions. Deliberately NOT `latest` — see docs/runbooks/release.md.
    image: ghcr.io/lutzi92/justrag:${JUSTRAG_VERSION:-stable}
    command: ["/app/migrate"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy

  go-server:
    image: ghcr.io/lutzi92/justrag:${JUSTRAG_VERSION:-stable}
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - rag-app-data:/app/data
      - rag-uploads:/app/uploads
      # Share the persistent JustFind rod profile with go-worker so the
      # server-side academic-search endpoint and the worker-side academic
      # research job use the same Chromium profile and reuse the same
      # warmed-up Anubis challenge cookie.
      - rag-justfind-profile:/app/data/justfind-profile
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  go-worker:
    image: ghcr.io/lutzi92/justrag:${JUSTRAG_VERSION:-stable}
    restart: unless-stopped
    command: ["/app/worker"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    tmpfs:
      - /tmp:size=512m
    volumes:
      - rag-app-data:/app/data
      - rag-uploads:/app/uploads
      - rag-justfind-profile:/app/data/justfind-profile
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    # Pinned to major version 18.
    # For migration from 16, use scripts/migrate_db_16_to_18.sh
    # pgvector image (superset of postgres:18) — required since main
    # migrations 0044/0045 add VECTOR columns to kg_entities/user_memory.
    # The unsuffixed tag currently resolves to the Debian bookworm build
    # (glibc 2.36). pgvector also publishes a -trixie variant (glibc 2.41);
    # switching to it — or this tag silently repointing there in a future
    # release — bumps the libc collation version on an existing volume.
    # Postgres will then warn about a collation mismatch and the text btree
    # indexes need REINDEX DATABASE + ALTER DATABASE ... REFRESH COLLATION
    # VERSION. Pin -bookworm explicitly if that surprise is unacceptable.
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    ports:
      - "${WORKER_BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-rag_db}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rag-db-data-v18:/var/lib/postgresql

  vectordb:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    shm_size: 2g
    ports:
      - "${WORKER_BIND_IP:-127.0.0.1}:5433:5432"
    environment:
      - POSTGRES_USER=${VECTOR_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${VECTOR_DB_PASSWORD:-postgres}
      - POSTGRES_DB=${VECTOR_DB_NAME:-rag_vector_db}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "max_parallel_maintenance_workers=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_DB_USER:-postgres} -d ${VECTOR_DB_NAME:-rag_vector_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rag-vector-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${WORKER_BIND_IP:-127.0.0.1}:6379:6379"
    # maxmemory-policy=volatile-lru: under memory pressure, evict least-recently-used
    # keys *with a TTL* rather than erroring on new writes. The embedding cache sets
    # a TTL on every entry (see internal/ai/embedding_cache.go), so cache entries are
    # eligible for eviction while Asynq's non-TTL'd task/queue keys are protected.
    # `allkeys-lru` risks silent Asynq task loss; `noeviction` causes task-lease-renewal
    # failures when the cache fills up.
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rag-redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_BIND_IP:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rag-minio-data:/data

volumes:
  rag-db-data-v18:
  rag-vector-data:
  rag-redis-data:
  rag-minio-data:
  rag-app-data:
  rag-uploads:
  rag-justfind-profile:
